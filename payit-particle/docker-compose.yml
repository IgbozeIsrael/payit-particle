version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payit_api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"

  proxy:
    image: nginx:alpine
    container_name: payit_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
