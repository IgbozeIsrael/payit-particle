[build]
  base = "payit-mobile"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "payit-mobile/netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "https://payit-particle-payit-particle.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
